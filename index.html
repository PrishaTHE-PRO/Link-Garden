<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Garden</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #c9e8f7 0%, #a8d4f0 60%, #90c8ee 100%);
      color: #1a3a1a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* ── Floating Clouds ─────────────────────────────── */
    .cloud {
      position: fixed;
      background: white;
      border-radius: 60px;
      opacity: 0.55;
      pointer-events: none;
      z-index: 0;
      filter: blur(1px);
    }

    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      background: white;
      border-radius: 50%;
    }

    .cloud::before {
      width: 55%;
      height: 160%;
      top: -55%;
      left: 12%;
    }

    .cloud::after {
      width: 38%;
      height: 130%;
      top: -40%;
      left: 52%;
    }

    @keyframes floatCloud {
      from { left: -500px; }
      to   { left: calc(100vw + 100px); }
    }

    .cloud {
      left: -500px;
    }

    .cloud-1  { width: 300px; height: 75px;  top: 5%;  animation: floatCloud 60s linear infinite; animation-delay: 0s; }
    .cloud-2  { width: 220px; height: 58px;  top: 14%; animation: floatCloud 50s linear infinite; animation-delay: -15s; }
    .cloud-3  { width: 360px; height: 88px;  top: 24%; animation: floatCloud 70s linear infinite; animation-delay: -35s; }
    .cloud-4  { width: 260px; height: 65px;  top: 35%; animation: floatCloud 55s linear infinite; animation-delay: -8s; }
    .cloud-5  { width: 310px; height: 78px;  top: 48%; animation: floatCloud 65s linear infinite; animation-delay: -28s; }
    .cloud-6  { width: 200px; height: 52px;  top: 60%; animation: floatCloud 48s linear infinite; animation-delay: -42s; }
    .cloud-7  { width: 280px; height: 70px;  top: 70%; animation: floatCloud 58s linear infinite; animation-delay: -20s; }
    .cloud-8  { width: 240px; height: 60px;  top: 80%; animation: floatCloud 52s linear infinite; animation-delay: -5s; }
    .cloud-9  { width: 330px; height: 82px;  top: 10%; animation: floatCloud 63s linear infinite; animation-delay: -47s; }
    .cloud-10 { width: 190px; height: 48px;  top: 55%; animation: floatCloud 45s linear infinite; animation-delay: -32s; }

    /* All content sits above clouds */
    #authScreen, #dashboard, #authPromptModal { position: relative; z-index: 1; }

    /* ── Auth Screen ─────────────────────────────────── */
    #authScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 14px;
      width: 100%;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 20px;
      padding: 40px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 360px;
      box-shadow: 0 8px 32px rgba(100,160,210,0.18);
    }

    #authScreen h2 {
      color: #2e6b2e;
      font-size: 24px;
      margin-bottom: 2px;
    }

    #authScreen input {
      padding: 12px 16px;
      border-radius: 8px;
      border: 1.5px solid #b0d4b0;
      background: rgba(255,255,255,0.85);
      color: #1a3a1a;
      width: 100%;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    #authScreen input:focus { border-color: #4caf50; }
    #authScreen input::placeholder { color: #90b890; }

    .auth-buttons { display: flex; gap: 12px; width: 100%; }

    .btn-primary {
      flex: 1;
      padding: 11px 0;
      background: #388e3c;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-primary:hover { background: #2e7d32; }

    .btn-secondary {
      flex: 1;
      padding: 11px 0;
      background: transparent;
      color: #388e3c;
      border: 1.5px solid #b0d4b0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      transition: border-color 0.2s;
    }

    .btn-secondary:hover { border-color: #4caf50; }

    #authError {
      color: #c62828;
      font-size: 13px;
      min-height: 18px;
      text-align: center;
    }

    .auth-toggle {
      font-size: 13px;
      color: #5a8a5a;
    }

    .auth-toggle span {
      color: #2e6b2e;
      text-decoration: underline;
      cursor: pointer;
    }

    /* ── Dashboard ───────────────────────────────────── */
    #dashboard {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    header {
      width: 100%;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.8);
    }

    header .logo {
      font-size: 20px;
      font-weight: 700;
      color: #2e6b2e;
      letter-spacing: 0.5px;
    }

    header .leaf { font-size: 22px; }

    #userEmail {
      margin-left: auto;
      font-size: 13px;
      color: #6a9a6a;
    }

    .btn-logout {
      padding: 6px 14px;
      background: transparent;
      color: #5a8a5a;
      border: 1px solid #b0d4b0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      margin-left: 12px;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-logout:hover { border-color: #4caf50; color: #2e6b2e; }

    .hero {
      margin-top: 80px;
      text-align: center;
    }

    .hero h1 {
      font-size: 42px;
      font-weight: 700;
      color: #1b5e20;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(255,255,255,0.6);
    }

    .hero p {
      font-size: 16px;
      color: #3a7a3a;
    }

    .input-area {
      margin-top: 48px;
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 620px;
      padding: 0 20px;
    }

    .input-area input {
      flex: 1;
      padding: 14px 18px;
      font-size: 15px;
      border: 2px solid #b0d4b0;
      border-right: none;
      border-radius: 10px 0 0 10px;
      background: rgba(255,255,255,0.80);
      color: #1a3a1a;
      outline: none;
      transition: border-color 0.2s;
      backdrop-filter: blur(6px);
    }

    .input-area input::placeholder { color: #90b890; }
    .input-area input:focus { border-color: #4caf50; }

    .input-area button {
      padding: 14px 22px;
      font-size: 15px;
      font-weight: 600;
      background: #388e3c;
      color: #fff;
      border: 2px solid #388e3c;
      border-radius: 0 10px 10px 0;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .input-area button:hover { background: #2e7d32; border-color: #2e7d32; }

    .links-section {
      margin-top: 48px;
      width: 100%;
      max-width: 620px;
      padding: 0 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .links-section .section-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #6a9a6a;
      margin-bottom: 4px;
    }

    .link-item {
      display: block;
      color: #1b5e20;
      text-decoration: none;
      font-size: 14px;
      padding: 6px 12px;
      word-break: break-all;
      border-radius: 6px;
      background: rgba(255,255,255,0.5);
      transition: background 0.15s, color 0.15s;
    }

    .link-item:hover {
      background: rgba(255,255,255,0.8);
      color: #2e7d32;
      text-decoration: underline;
    }

    .empty-hint {
      font-size: 14px;
      color: #7aaa7a;
      font-style: italic;
    }

    /* ── Auth Prompt Modal ───────────────────────────── */
    #authPromptModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(100,160,220,0.35);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-box {
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.95);
      border-radius: 16px;
      padding: 36px 32px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(100,160,210,0.2);
    }

    .modal-box p {
      color: #1b5e20;
      font-size: 16px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .modal-box .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- ── Floating Clouds ──────────────────────────────── -->
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
  <div class="cloud cloud-4"></div>
  <div class="cloud cloud-5"></div>
  <div class="cloud cloud-6"></div>
  <div class="cloud cloud-7"></div>
  <div class="cloud cloud-8"></div>
  <div class="cloud cloud-9"></div>
  <div class="cloud cloud-10"></div>

  <!-- ── Auth Screen ──────────────────────────────────── -->
  <div id="authScreen">
    <div class="auth-card">
      <span style="font-size: 40px;">🌿</span>
      <h2>Welcome to Link Garden</h2>
      <p style="color:#5a8a5a; font-size:14px;" id="authSubtitle">Sign in to grow your collection.</p>

      <input id="authEmail" type="email" placeholder="Email" autocomplete="email" />
      <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password" />

      <div class="auth-buttons" id="authButtons">
        <button class="btn-primary" onclick="logIn()">Log In</button>
        <button class="btn-secondary" onclick="signUp()">Sign Up</button>
      </div>

      <p id="authError"></p>

      <p class="auth-toggle" id="authToggle">
        No account? <span onclick="switchToSignup()">Create one</span>
      </p>
    </div>
  </div>

  <!-- ── Dashboard ────────────────────────────────────── -->
  <div id="dashboard">
    <header>
      <span class="leaf">🌿</span>
      <span class="logo">Link Garden</span>
      <span id="userEmail"></span>
      <button class="btn-logout" onclick="logOut()">Log out</button>
    </header>

    <div class="hero">
      <h1>Your Link Garden</h1>
      <p>Paste a link and plant it to grow your collection.</p>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="linkInput"
        placeholder="Paste a link here..."
        autofocus
      />
      <button onclick="plantLink()">🌱 Plant</button>
    </div>

    <div class="links-section" id="linksSection">
      <div class="section-label" id="sectionLabel" style="display:none;">Planted links</div>
      <span class="empty-hint" id="emptyHint">Your planted links will appear here.</span>
    </div>
  </div>

  <!-- ── Auth Prompt Modal (unauthenticated plant attempt) ── -->
  <div id="authPromptModal">
    <div class="modal-box">
      <p>🌱 Create an account to plant and save your links across sessions.</p>
      <div class="modal-actions">
        <button class="btn-primary" onclick="goToSignup()">Create Account</button>
        <button class="btn-secondary" onclick="closeAuthPrompt()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ── Firebase (CDN, no build tool needed) ─────────── -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      query,
      where,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBt0nRF9lvAt_ODtNVnH6tRoYxP3I3YUa0",
      authDomain: "link-garden-c3369.firebaseapp.com",
      projectId: "link-garden-c3369",
      storageBucket: "link-garden-c3369.firebasestorage.app",
      messagingSenderId: "447163301900",
      appId: "1:447163301900:web:9caee919348f3a8ebeae29",
      measurementId: "G-P4G20SBKKB"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // ── Auth state listener ────────────────────────────
    onAuthStateChanged(auth, (user) => {
      if (user) {
        showDashboard(user);
        loadLinks(user.uid);
      } else {
        showAuthScreen();
      }
    });

    function showDashboard(user) {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'flex';
      document.getElementById('userEmail').textContent = user.email;
    }

    function showAuthScreen() {
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('dashboard').style.display = 'none';
    }

    // ── Sign up ────────────────────────────────────────
    window.signUp = async function () {
      clearError();
      const email    = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      try {
        await createUserWithEmailAndPassword(auth, email, password);
      } catch (e) {
        showError(friendlyError(e.code));
      }
    };

    // ── Log in ─────────────────────────────────────────
    window.logIn = async function () {
      clearError();
      const email    = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) {
        showError(friendlyError(e.code));
      }
    };

    // ── Log out ────────────────────────────────────────
    window.logOut = async function () {
      await signOut(auth);
    };

    // ── Plant link ─────────────────────────────────────
    window.plantLink = async function () {
      const user = auth.currentUser;
      const raw  = document.getElementById('linkInput').value.trim();
      if (!raw) return;

      if (!user) {
        document.getElementById('authPromptModal').style.display = 'flex';
        return;
      }

      const url = raw.startsWith('http://') || raw.startsWith('https://')
        ? raw : 'https://' + raw;

      await addDoc(collection(db, 'links'), {
        uid:     user.uid,
        url,
        savedAt: new Date()
      });

      document.getElementById('linkInput').value = '';
      loadLinks(user.uid);
    };

    // ── Load links from Firestore ──────────────────────
    async function loadLinks(uid) {
      const q        = query(collection(db, 'links'), where('uid', '==', uid), orderBy('savedAt', 'desc'));
      const snapshot = await getDocs(q);

      const section = document.getElementById('linksSection');
      const label   = document.getElementById('sectionLabel');
      const hint    = document.getElementById('emptyHint');

      section.querySelectorAll('.link-item').forEach(el => el.remove());

      if (snapshot.empty) {
        hint.style.display  = 'block';
        label.style.display = 'none';
        return;
      }

      hint.style.display  = 'none';
      label.style.display = 'block';

      snapshot.forEach(doc => {
        const { url } = doc.data();
        const a = document.createElement('a');
        a.href      = url;
        a.target    = '_blank';
        a.rel       = 'noopener noreferrer';
        a.className = 'link-item';
        a.textContent = url;
        section.appendChild(a);
      });
    }

    // ── Modal controls ─────────────────────────────────
    window.closeAuthPrompt = function () {
      document.getElementById('authPromptModal').style.display = 'none';
    };

    window.goToSignup = function () {
      closeAuthPrompt();
      showAuthScreen();
      switchToSignup();
    };

    // ── Auth screen toggle (login ↔ signup) ────────────
    window.switchToSignup = function () {
      document.getElementById('authSubtitle').textContent = 'Create your account to get started.';
      document.getElementById('authToggle').innerHTML = 'Already have an account? <span onclick="switchToLogin()">Log in</span>';
    };

    window.switchToLogin = function () {
      document.getElementById('authSubtitle').textContent = 'Sign in to grow your collection.';
      document.getElementById('authToggle').innerHTML = 'No account? <span onclick="switchToSignup()">Create one</span>';
    };

    // ── Keyboard shortcut ──────────────────────────────
    document.getElementById('linkInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') plantLink();
    });

    // ── Helpers ────────────────────────────────────────
    function showError(msg) {
      document.getElementById('authError').textContent = msg;
    }

    function clearError() {
      document.getElementById('authError').textContent = '';
    }

    function friendlyError(code) {
      const map = {
        'auth/invalid-email':          'Please enter a valid email address.',
        'auth/user-not-found':         'No account found with that email.',
        'auth/wrong-password':         'Incorrect password.',
        'auth/email-already-in-use':   'An account with this email already exists.',
        'auth/weak-password':          'Password must be at least 6 characters.',
        'auth/invalid-credential':     'Incorrect email or password.',
        'auth/too-many-requests':      'Too many attempts. Please try again later.',
      };
      return map[code] || 'Something went wrong. Please try again.';
    }
  </script>

</body>
</html>
